<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — GigTry</title>
  {%- if page.canonical %}
  <link rel="canonical" href="{{ page.canonical }}">
  {%- endif %}
  <meta name="description" content="{{ page.excerpt | default: 'GigTry — 94 free AI tools for freelancers, businesses and creators.' }}">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="{{ page.title }} — GigTry">
  <meta property="og:description" content="{{ page.excerpt | default: 'Free, browser-based AI tools. No install, no credit card.' }}">
  <meta property="og:type" content="article">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a202c; background: #ffffff;
    }
    .mirror-banner {
      background: #ecfdf5; border-bottom: 1px solid #a7f3d0;
      padding: 10px 20px; font-size: 14px; text-align: center; color: #065f46;
    }
    .mirror-banner a { color: #047857; font-weight: 600; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-size: 1.9em; line-height: 1.25; letter-spacing: -0.02em; margin: 0 0 1em; }
    h2 { letter-spacing: -0.01em; margin-top: 2em; }
    a { color: #059669; }
    blockquote { margin: 1.5em 0; padding: 0.75em 1.25em; border-left: 4px solid #a7f3d0; background: #f0fdf4; border-radius: 0 8px 8px 0; }
    blockquote p { margin: 0.25em 0; }
    table { border-collapse: collapse; width: 100%; margin: 1.5em 0; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 12px; text-align: left; }
    th { background: #f8fafc; }
    footer { max-width: 720px; margin: 0 auto; padding: 24px 20px 40px; border-top: 1px solid #e2e8f0; font-size: 14px; color: #64748b; }
    footer a { color: #059669; }
    @media (prefers-color-scheme: dark) {
      body { color: #e2e8f0; background: #0f172a; }
      .mirror-banner { background: #064e3b; border-color: #065f46; color: #d1fae5; }
      .mirror-banner a { color: #6ee7b7; }
      a { color: #34d399; }
      blockquote { border-color: #065f46; background: #06281f; }
      th, td { border-color: #334155; } th { background: #1e293b; }
      footer { border-color: #334155; color: #94a3b8; } footer a { color: #34d399; }
    }
  </style>
</head>
<body>
  <div class="mirror-banner">
    📌 This is a lightweight syndicated mirror. Read the original, interactive version on
    <a href="{{ page.canonical | default: 'https://gigtry.com' }}">GigTry</a>.
  </div>
  <main>
    {{ content }}
  </main>
  <footer>
    Published daily by the GigTry autopilot · <a href="https://gigtry.com">gigtry.com</a> · 94 free AI tools, no credit card.
  </footer>
</body>
</html>
